[package]
name = "stellar-guard"
description = "stellar-guard: static security analysis for Soroban smart contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

# `cargo binstall stellar-guard` downloads the release archive instead of compiling.
# Linux archives are static musl builds; binstall falls back to them on gnu hosts.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/stellar-guard-v{ version }-{ target }{ archive-suffix }"
bin-dir = "stellar-guard-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "stellar-guard"
path = "src/main.rs"

[dependencies]
guard-parser.workspace = true
guard-engine.workspace = true
guard-rules.workspace = true
guard-reporters.workspace = true
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true

[dev-dependencies]
criterion.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
serde_json.workspace = true
regex.workspace = true

[[bench]]
name = "scan"
harness = false

[lints]
workspace = true
