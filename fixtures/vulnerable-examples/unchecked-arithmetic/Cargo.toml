[package]
name = "fixture-unchecked-arithmetic"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "22.0.0"

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

# Standalone workspace so this fixture is not part of the stellar-guard workspace.
[workspace]

[profile.release]
opt-level = "z"
# overflow-checks is intentionally NOT enabled: plain arithmetic wraps in release builds.
debug = 0
strip = "symbols"
panic = "abort"
codegen-units = 1
lto = true
